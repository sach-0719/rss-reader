<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News-Spot</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Materialize -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

  <!-- 自作CSS -->
  <link rel="stylesheet" href="css/rss.css">
</head>

<body>

<!-- =========================
  ナビ
========================= -->
<nav class="grey darken-3">
  <div class="nav-wrapper container">
    <a href="#" data-target="nav-mobile" class="sidenav-trigger show-on-large">
      <i class="material-icons">menu</i>
    </a>
  </div>
</nav>

<!-- =========================
  サイドバー（復元）
========================= -->
<ul id="nav-mobile" class="sidenav">
  <li>
    <h5 style="padding:10px;">RSS一覧</h5>
  </li>

  <li style="padding:10px;">
    <input id="rss-file-input" type="file" accept=".xml,.rss">
  </li>

  <li>
    <div id="rss-list"></div>
  </li>
  <li>
    <a href="info.html" class="waves-effect">
      <i class="material-icons">help</i>このサイトについて
    </a>
</ul>

<!-- =========================
  タイトル
========================= -->
<h2 class="center" id="site-title">News-Spot</h2 >
<h5 class="center light" id="site-description">RSSニュースリーダー</h5>
<!-- 検索ボタン -->
<div class="center" style="margin:20px 0;">
  <a class="btn modal-trigger black" href="#search-modal">
    <i class="material-icons left">search</i>
    詳細検索
  </a>
</div>

<!-- =========================
  コンテンツ（復元）
========================= -->
<div class="container">

  <!-- フィーチャー枠（残す） -->
   <noscript>
      <div class="card yellow lighten-4">
          <div class="card-content">



            <span class="card-title">JavaScriptが無効になっています</span>
            <p>このサイトはJavascriptを必要とします。JavaScriptを有効にしてください。</p>
          </div>
      </div>
        </noscript>
  <div id="featured-container"></div>

  <!-- 記事一覧 -->
  <div id="news-container"></div>

</div>



<!-- =========================
  JS
========================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<script src="js/rss.js"></script>

<!-- Materialize初期化（復元） -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  M.AutoInit();
});
</script>

<!-- =========================
  検索モーダル
========================= -->
<div id="search-modal" class="modal">

  <div class="modal-content">

    <h5>詳細検索</h5>

    <div class="input-field">
      <input id="search-keyword" type="text">
      <label for="search-keyword">キーワード</label>
    </div>

    <div class="input-field">
      <select id="search-category">
        <option value="">全カテゴリ</option>
      </select>
      <label>カテゴリ</label>
    </div>

    <div class="input-field">
      <input id="date-from" class="datepicker" type="text">
      <label for="date-from">開始日</label>
    </div>

    <div class="input-field">
      <input id="date-to" class="datepicker" type="text">
      <label for="date-to">終了日</label>
    </div>

  </div>

  <div class="modal-footer">
    <a class="modal-close btn-flat"><i class="material-icons">close</i></a>
    <a id="search-apply" class="btn blue modal-close"><i class="material-icons left">search</i> 検索実行</a>
  </div>

</div>

<!-- =========================
  QRモーダル
========================= -->
<div id="qr-modal" class="modal">

  <div class="modal-content center">

    <h5>QRコード</h5>

    <img id="qr-image" style="max-width:250px;">

    <p id="qr-url"></p>

  </div>

  <div class="modal-footer">
    <a class="modal-close btn-flat"><i class="material-icons">close</i></a>
  </div>

</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>News-spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
  <!-- CSS読み込み -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/materialize.css">
  <link rel="stylesheet" href="css/rss.css">
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="grey accent-4" role="navigation">
    <div class="nav-wrapper container">
      
      <!-- サイドバー呼び出しボタン -->
      <a href="#" data-target="nav-mobile" class="sidenav-trigger show-on-large"><i class="material-icons">menu</i></a>
    </div>
  </nav>

<ul id="nav-mobile" class="sidenav">
  <!-- タイトル部分 -->
<h1 class="header center black-text" id="site-title">News-Spot</h1>
<h5 class="center header s12 light black-text" id="site-description">
  初めてのご利用ありがとうございます！
</h5>
  <!-- 設定エリア -->
  <li style="padding: 0 10px;">
    <p style="font-size: 0.8rem; color: #666;">取得したいURLを入力してください。<br>RSS 2.0とYouTube RSSのURLに対応しています。</p>
    <div class="input-field" style="margin: 10px 0;">
      <input placeholder="https://..." id="rss-url-input" type="text">
    </div>
      <div class="file-field input-field">
    <div class="btn green">
      <span><i class="material-icons">upload</i></span>
      <input type="file" id="rss-file-input" accept=".xml,.rss,.rdf">
    </div>

    <div class="file-path-wrapper">
      <input class="file-path validate" type="text" placeholder="RSSファイルを選択">
    </div>
  </div>
    <button id="save-rss-btn" class="btn green" style="width: 100%; height: 36px; line-height: 36px;">
      <i class="material-icons left">save</i>更新</button>
          </li>
    <li><a href="" class="waves-effect" href="#!">このサイトについて</a></li>
</ul>
<h1 class="header center black-text">News-Spot</h1>
  <!-- ニュース表示エリア -->
  <div class="container">
    <div id="news-container"  style="margin-top: 20px;">
      <div class="center-align">
        <p>メニュー <i class="material-icons" style="font-size: 1rem; vertical-align: middle;">menu</i> からRSS URLを設定してください。</p>
      </div>
    </div>
  </div>

<!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  
  <!-- 自作のJSファイルを読み込む（これ一行にする） -->
  <script src="js/rss.js"></script>
</body>
  
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic RSS Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
  <!-- CSS読み込み -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  
  <style>
    .card-image img { height: 180px; object-fit: cover; }
    .card-title { background: rgba(0,0,0,0.6); width: 100%; font-size: 0.9rem !important; padding: 10px !important; }
    /* Chrome向けアイコン表示補正 */
    .material-icons { font-family: 'Material Icons' !important; }
    /* ロゴとアイコンの重なり防止 */
.nav-wrapper {
  position: relative;
}

/* ロゴの余白を確保（モバイル・PC両方） */
.brand-logo {
  margin-left: 20px; /* 左側に少し余裕を持たせる */
  white-space: nowrap; /* 改行防止 */
}

/* アイコン（メニューボタン）が常に手前に来るように調整 */
.sidenav-trigger {
  margin: 0 !important;
  z-index: 10;
}

/* スマホなど画面が小さい時にロゴが中央に寄って重なるのを防ぐ */
@media only screen and (max-width: 992px) {
  .brand-logo {
    left: 55% !important; /* 中央より少し右に寄せる */
    transform: translateX(-50%);
    font-size: 1.2rem !important; /* 重なる場合は文字サイズを少し小さく */
  }
}
  </style>
</head>
<body>

  <!-- ナビゲーションバー -->
  <nav class="pink accent-4" role="navigation">
    <div class="nav-wrapper container">
      <a id="logo-container" href="#" class="brand-logo">RSS Reader</a>
      
      <!-- サイドバー呼び出しボタン -->
      <a href="#" data-target="nav-mobile" class="sidenav-trigger show-on-large"><i class="material-icons">settings</i></a>
    </div>
  </nav>

<ul id="nav-mobile" class="sidenav">
  <!-- タイトル部分 -->
  <li><h5 style="padding: 0 20px;">RSS設定</h5></li>
  
  <!-- 設定エリア -->
  <li style="padding: 0 20px;">
    <p style="font-size: 0.8rem; color: #666;">取得したいURLを入力してください。</p>
    <div class="input-field" style="margin: 10px 0;">
      <input placeholder="https://..." id="rss-url-input" type="text">
    </div>
    <button id="save-rss-btn" class="btn green" style="width: 100%; height: 36px; line-height: 36px;">
      <i class="material-icons left">save</i>更新</button>
          <li><div class="divider"></div></li>   
          </li>
              <li><i class="material-icons">info</i><a class="waves-effect" href="#!">このサイトについて</a></li>

</ul>

  <!-- ニュース表示エリア -->
  <div class="container">
    <div id="news-container" class="row" style="margin-top: 20px;">
      <div class="center-align">
        <p>設定アイコン <i class="material-icons" style="font-size: 1rem; vertical-align: middle;">settings</i> からRSS URLを設定してください。</p>
      </div>
    </div>
  </div>

<!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  
  <!-- 自作のJSファイルを読み込む（これ一行にする） -->
  <script src="js/rss.js"></script>
</body>
  <style>
  /* 全ての要素にフォントを適用 */
  * {
    font-family: 'M PLUS Rounded 1c', sans-serif !important;
  }

  /* カードのタイトルなど、特定の要素で上書きされないように念押し */
  body, input, button, .card-title, .brand-logo {
    font-family: 'M PLUS Rounded 1c', sans-serif !important;
  }
  
  /* 既存のスタイル */
  .card-image img { height: 180px; object-fit: cover; }
  /* ...以下略... */
</style>
<style>
  /* カードの高さを揃えるための設定 */
  #news-container {
    display: flex;
    flex-wrap: wrap;
  }
  
  .card {
    margin: 0.5rem 0 1rem 0;
    transition: transform 0.2s;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  /* ボタンの文字サイズ微調整 */
  .card-action .btn-small {
    font-weight: bold;
    font-size: 0.8rem;
  }
</style>
</body>
</html>
